name: Build and Post Product Videos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1-5'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version

      - name: Require Google Cloud configuration
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$GCP_SA_KEY" || { echo "Missing GCP_SA_KEY"; exit 1; }
          test -n "$GCP_PROJECT_ID" || { echo "Missing GCP_PROJECT_ID"; exit 1; }

      - name: Prepare Google credentials
        id: prepare-gcp
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          CREDS_PATH="$HOME/gcp-key.json"
          if [[ "$GCP_SA_KEY" == \{* ]]; then
            printf '%s\n' "$GCP_SA_KEY" > "$CREDS_PATH"
          else
            echo "$GCP_SA_KEY" | base64 -d > "$CREDS_PATH"
          fi
          {
            echo "credentials_json<<EOF"
            cat "$CREDS_PATH"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ steps.prepare-gcp.outputs.credentials_json }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run pipeline regression tests
        run: node --test scripts/tests/video-publish-qa.test.mjs scripts/tests/video-text.test.mjs scripts/tests/social-platform-selection.test.mjs scripts/tests/social-top5-post.test.mjs

      - name: Generate, validate, upload, and post scheduled product
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          VIDEO_VARIATIONS_PER_PRODUCT: '1'
        run: node scripts/cloud-video-social-job.mjs

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: product-videos
          path: |
            public/videos/**
            content/generated-videos/**
          if-no-files-found: error
