name: Manual Build and Post Product Videos

on:
  workflow_dispatch:
  # Scheduled product publishing belongs to natureswaysoil/video.
  # This workflow is an explicit manual fallback, avoiding duplicate posts.

concurrency:
  group: manual-product-video-posting
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version

      # Same credential secret as the other Google Cloud workflows; the old
      # GCP_SA_KEY/GCP_PROJECT_ID pair is no longer set.
      - name: Require Google Cloud configuration
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$GCP_SERVICE_ACCOUNT_JSON" || { echo "Missing GitHub secret: GCP_SERVICE_ACCOUNT_JSON"; exit 1; }

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run pipeline regression tests
        run: node --test scripts/tests/video-publish-qa.test.mjs scripts/tests/video-text.test.mjs scripts/tests/social-platform-selection.test.mjs scripts/tests/social-top5-post.test.mjs

      - name: Generate, validate, upload, and post scheduled product
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID || steps.auth.outputs.project_id }}
          VIDEO_VARIATIONS_PER_PRODUCT: '1'
        run: node scripts/cloud-video-social-job.mjs

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: product-videos
          path: |
            public/videos/**
            content/generated-videos/**
          if-no-files-found: error
