name: Build Full Product Video Catalog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-catalog-videos.yml
      - config/catalog-video-products.json
      - scripts/create-quality-seed-videos.mjs
      - scripts/add-audio-to-seed-videos.mjs
      - scripts/lib/video-publish-qa.mjs
      - scripts/lib/video-text.mjs

concurrency:
  group: catalog-product-videos
  cancel-in-progress: false

jobs:
  build-catalog-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Check Google Cloud credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$GCP_SERVICE_ACCOUNT_JSON" || { echo "Missing GCP_SERVICE_ACCOUNT_JSON"; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Load required generation secrets
        env:
          REPOSITORY_PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REPOSITORY_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          SECRET_PROJECT_ID="${GOOGLE_CLOUD_PROJECT:-natureswaysoil-video}"

          load_required_secret () {
            local secret_name="$1"
            local env_name="$2"
            local repository_value="$3"
            local value="$repository_value"

            if [ -z "$value" ]; then
              value="$(gcloud secrets versions access latest --secret="$secret_name" --project="$SECRET_PROJECT_ID")"
            fi
            test -n "$value" || { echo "Required secret $secret_name is empty"; exit 1; }
            echo "::add-mask::$value"
            {
              echo "$env_name<<VIDEO_SECRET_EOF"
              echo "$value"
              echo "VIDEO_SECRET_EOF"
            } >> "$GITHUB_ENV"
          }

          load_required_secret PEXELS_API_KEY PEXELS_API_KEY "$REPOSITORY_PEXELS_API_KEY"
          load_required_secret OPENAI_API_KEY OPENAI_API_KEY "$REPOSITORY_OPENAI_API_KEY"

      - name: Generate product videos
        env:
          GOOGLE_CLOUD_PROJECT: natureswaysoil-video
          VIDEO_PRODUCT_CONFIG: config/catalog-video-products.json
          VIDEO_WIDTH: '1080'
          VIDEO_HEIGHT: '1920'
          VIDEO_FPS: '30'
          FFMPEG_PRESET: medium
          VIDEO_CRF: '18'
        run: node scripts/create-quality-seed-videos.mjs --all

      - name: Add narration
        env:
          GOOGLE_CLOUD_PROJECT: natureswaysoil-video
          REPLACE_ORIGINAL_AUDIO: '1'
        run: |
          set -euo pipefail
          PRODUCT_IDS="$(node -e "const c=require('./config/catalog-video-products.json'); process.stdout.write(c.products.map(p=>p.id).join(','))")"
          echo "Narrating: $PRODUCT_IDS"
          PRODUCT_IDS="$PRODUCT_IDS" node scripts/add-audio-to-seed-videos.mjs

      - name: Enforce product video quality
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'fs';
          import { validateVideoForPublishing } from './scripts/lib/video-publish-qa.mjs';

          const config = JSON.parse(fs.readFileSync('./config/catalog-video-products.json', 'utf8'));
          const results = [];
          for (const product of config.products) {
            const file = `public/videos/${product.id}.mp4`;
            const result = validateVideoForPublishing(file);
            results.push({ id: product.id, ...result });
          }
          console.log(JSON.stringify(results, null, 2));
          NODE

      - name: Preserve generated catalog artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catalog-product-videos
          path: |
            public/videos/NWS_*.mp4
            public/videos/NWS_*.jpg
            content/generated-videos/*-quality-seed-plan.json
          if-no-files-found: error

      - name: Verify Cloud Storage write access
        env:
          VIDEO_OUTPUT_BUCKET: natureswaysoil-videos
          VIDEO_OUTPUT_PREFIX: seed-videos
        run: |
          set -euo pipefail
          ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          echo "Active Google Cloud account: $ACTIVE_ACCOUNT"
          echo "Target bucket: gs://$VIDEO_OUTPUT_BUCKET/$VIDEO_OUTPUT_PREFIX/"
          : > /tmp/nws-upload-probe.txt
          if ! gcloud storage cp /tmp/nws-upload-probe.txt "gs://$VIDEO_OUTPUT_BUCKET/$VIDEO_OUTPUT_PREFIX/.upload-probe-$GITHUB_RUN_ID.txt" --cache-control="no-store"; then
            echo "::error::The authenticated account cannot create objects in gs://$VIDEO_OUTPUT_BUCKET/$VIDEO_OUTPUT_PREFIX/"
            echo "::error::Grant Storage Object Creator on bucket $VIDEO_OUTPUT_BUCKET to: $ACTIVE_ACCOUNT"
            echo "Required role: roles/storage.objectCreator"
            exit 1
          fi

      - name: Upload catalog videos to Cloud Storage
        env:
          VIDEO_OUTPUT_BUCKET: natureswaysoil-videos
          VIDEO_OUTPUT_PREFIX: seed-videos
        run: |
          set -euo pipefail
          DEST="gs://$VIDEO_OUTPUT_BUCKET/$VIDEO_OUTPUT_PREFIX"
          node -e "const c=require('./config/catalog-video-products.json'); for (const p of c.products) console.log(p.id)" > /tmp/product-ids.txt
          while IFS= read -r id; do
            gcloud storage cp "public/videos/$id.mp4" "$DEST/$id-catalog-v2.mp4" --cache-control="public, max-age=31536000, immutable"
            if [ -f "public/videos/$id.jpg" ]; then
              gcloud storage cp "public/videos/$id.jpg" "$DEST/$id-catalog-v2.jpg" --cache-control="public, max-age=31536000, immutable"
            fi
          done < /tmp/product-ids.txt

