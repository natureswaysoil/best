name: HeyGen v3 authenticated render gate
on:
  push:
    branches: [heygen-v3-migration-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-once:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify HeyGen v3 (single unpublished video)
        run: node scripts/verify-heygen-v3.mjs
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_AVATAR_ID: ${{ vars.HEYGEN_AVATAR_ID }}
          HEYGEN_VOICE_ID: ${{ vars.HEYGEN_VOICE_ID }}
