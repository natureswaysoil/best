name: HeyGen v3 authenticated render gate
on:
  push:
    branches: [heygen-v3-migration-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Download migration branch without broken submodule checkout
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_COMMIT_SHA}" -o /tmp/repo.tar.gz
          tar -xzf /tmp/repo.tar.gz --strip-components=1
          test -f scripts/verify-heygen-v3.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify HeyGen v3 (single unpublished video)
        run: node scripts/verify-heygen-v3.mjs
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_AVATAR_ID: ${{ vars.HEYGEN_AVATAR_ID }}
          HEYGEN_VOICE_ID: ${{ vars.HEYGEN_VOICE_ID }}
