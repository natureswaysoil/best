name: HeyGen v3 staging validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/heygen-video-generator.mjs'
      - '.github/workflows/heygen-v3-staging.yml'
  push:
    branches: [heygen-v3-migration-20261019]
permissions:
  contents: read
jobs:
  static-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Download immutable triggering revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://codeload.github.com/${REPOSITORY}/tar.gz/${REVISION}" -o /tmp/repo.tar.gz
          tar -xzf /tmp/repo.tar.gz --strip-components=1
          test -f scripts/heygen-video-generator.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check scripts/heygen-video-generator.mjs
      - name: Verify migration endpoints and forbid legacy API calls in primary generator
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const source = readFileSync('scripts/heygen-video-generator.mjs','utf8');
          for(const endpoint of ['/videos', '/avatars/looks', '/voices']) assert(source.includes(endpoint), `Missing v3 endpoint: ${endpoint}`);
          for(const legacy of ['api.heygen.com/v1/', 'api.heygen.com/v2/', 'video_status.get', '/video/generate']) assert(!source.includes(legacy), `Legacy HeyGen reference remains: ${legacy}`);
          assert(source.includes("type: 'avatar'"));
          assert(source.includes('voice_settings'));
          console.log('Static v3 endpoint assertions passed');
          NODE
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run type-check
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
